# Fabrique l'installeur Windows de Noob LOL.
# Onglet Actions → « Installeur Windows » → Run workflow :
#   - « Publier une Release » coché (par défaut) : crée la Release vX.Y.Z (version de package.json) avec l'installeur.
#     Les PC équipés de Noob LOL se mettent alors à jour tout seuls.
#   - décoché : fabrique seulement l'installeur (téléchargeable dans les artefacts de l'exécution).
# Pousser un tag « vX.Y.Z » publie aussi une Release.
name: Installeur Windows

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publier une Release (mises à jour automatiques)'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Fabriquer et publier la Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.publish
        shell: bash
        run: |
          set -o pipefail
          npx electron-builder --win --publish always 2>&1 | tee build.log || { echo "::error title=electron-builder::$(tail -c 3500 build.log | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')"; exit 1; }
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Rendre la Release publique
        if: startsWith(github.ref, 'refs/tags/v') || inputs.publish
        shell: bash
        run: gh release edit "v$(node -p "require('./package.json').version")" --draft=false --latest -R "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Fabriquer sans publier
        if: ${{ !startsWith(github.ref, 'refs/tags/v') && !inputs.publish }}
        shell: bash
        run: |
          set -o pipefail
          npx electron-builder --win --publish never 2>&1 | tee build.log || { echo "::error title=electron-builder::$(tail -c 3500 build.log | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: Noob-LOL-installeur
          path: dist/*.exe

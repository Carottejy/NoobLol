<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://ddragon.leagueoflegends.com">
  <title>Noob LOL — Mon build</title>
  <style>
    html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; color: #f0e6d2; font: 12px/1.25 system-ui, "Segoe UI", sans-serif; user-select: none; }
    #box { position: absolute; inset: 2px; display: flex; flex-direction: column; gap: 3px; padding: 5px 8px;
      background: rgba(7, 13, 24, .86); border: 1px solid #c8aa6e; border-radius: 10px; box-shadow: 0 2px 10px rgba(0,0,0,.6); -webkit-app-region: drag; cursor: move; }
    #box.hidden { display: none; }
    .ttl { display: flex; gap: 6px; align-items: baseline; min-width: 0; font-size: 11px; }
    .ttl b { color: #f0d58c; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .ttl span { color: #9aa3b2; white-space: nowrap; }
    .nm { display: flex; gap: 6px; align-items: center; white-space: nowrap; min-width: 0; }
    .nm b { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
    .nm span { margin-left: auto; flex: none; } .nm .miss { color: #9aa3b2; } .nm .ok { color: #5fd18a; font-weight: 700; }
    .row { display: flex; align-items: center; gap: 3px; flex-wrap: nowrap; overflow: hidden; }
    .it { position: relative; width: 24px; height: 24px; padding: 0; border: 0; background: none; flex: none; }
    .it img { width: 24px; height: 24px; border-radius: 4px; border: 1px solid #22344f; display: block; opacity: .6; }
    .it.big, .it.big img { width: 28px; height: 28px; } .it.big img { opacity: 1; border-color: #c8aa6e; }
    .it.sm, .it.sm img { width: 20px; height: 20px; }
    .it.own img { opacity: 1; border-color: #5fd18a; }
    .it.next img { opacity: 1; border: 2px solid #c8aa6e; box-shadow: 0 0 6px rgba(200,170,110,.7); }
    .it.own i { position: absolute; right: -3px; bottom: -3px; font-style: normal; font-size: 9px; background: #5fd18a; color: #04140a; border-radius: 50%; width: 12px; height: 12px; display: flex; align-items: center; justify-content: center; font-weight: 900; }
    .ar { color: #6b7a90; font-size: 10px; }
    .sep { width: 1px; height: 18px; background: #22344f; margin: 0 3px; }
    .row.sit { opacity: .9; }
    .ad { display: flex; align-items: center; gap: 5px; margin: 3px 0; font-size: 11px; color: #f0d58c; line-height: 1.2; }
  </style>
</head>
<body>
  <div id="box" class="hidden" title="Glisse pour déplacer"></div>
  <script src="overlay.js"></script>
</body>
</html>

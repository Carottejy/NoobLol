<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://ddragon.leagueoflegends.com">
  <title>Noob LOL — Mon build</title>
  <style>
    html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; color: #f0e6d2; font: 12px/1.25 system-ui, "Segoe UI", sans-serif; user-select: none; }
    #box { position: absolute; inset: 2px; display: grid; grid-template-columns: 46px minmax(0, 1fr); grid-template-rows: auto auto 1fr; column-gap: 8px; row-gap: 3px; padding: 6px 8px;
      background: rgba(7, 13, 24, .86); border: 1px solid #c8aa6e; border-radius: 10px; box-shadow: 0 2px 10px rgba(0,0,0,.6); -webkit-app-region: drag; cursor: move; }
    #box.hidden { display: none; }
    .nx { grid-row: 1 / 3; position: relative; width: 46px; height: 46px; }
    .nx img { width: 46px; height: 46px; border-radius: 6px; border: 2px solid #c8aa6e; display: block; }
    .nx.ok img { border-color: #5fd18a; box-shadow: 0 0 8px #5fd18a; }
    .ttl { display: flex; gap: 6px; align-items: baseline; min-width: 0; }
    .ttl b { color: #f0d58c; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .ttl span { color: #9aa3b2; font-size: 11px; white-space: nowrap; }
    .nm { min-width: 0; display: flex; gap: 6px; align-items: baseline; white-space: nowrap; }
    .nm b { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
    .nm span { margin-left: auto; flex: none; }
    .nm .miss { color: #9aa3b2; } .nm .ok { color: #5fd18a; font-weight: 700; }
    .row { grid-column: 1 / 3; display: flex; align-items: center; gap: 3px; }
    .row .it { position: relative; width: 26px; height: 26px; }
    .row .it img { width: 26px; height: 26px; border-radius: 4px; border: 1px solid #22344f; display: block; opacity: .55; }
    .row .it.own img { opacity: 1; border-color: #5fd18a; }
    .row .it.next img { opacity: 1; border-color: #c8aa6e; }
    .row .it.own i { position: absolute; right: -3px; bottom: -3px; font-style: normal; font-size: 10px; background: #5fd18a; color: #04140a; border-radius: 50%; width: 13px; height: 13px; display: flex; align-items: center; justify-content: center; font-weight: 900; }
    .row .ar { color: #6b7a90; font-size: 10px; }
    .row .sep { width: 1px; height: 20px; background: #22344f; margin: 0 4px; }
    .grip { margin-left: auto; color: #6b7a90; font-size: 13px; letter-spacing: -2px; }
  </style>
</head>
<body>
  <div id="box" class="hidden" title="Glisse pour déplacer"></div>
  <script src="overlay.js"></script>
</body>
</html>
